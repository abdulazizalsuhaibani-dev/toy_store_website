{% extends "layouts/base.html" %}

{% block title %}{{ t.registerDone }}{% endblock %}

{% block content %}
<div class="hb-shell" style="padding-top:44px;max-width:560px">
  <div class="hb-panel hb-panel--tall" style="text-align:center;background:var(--green-soft)">
    <div style="display:flex;justify-content:center">
      {% include 'includes/mascot.html' with mascot_width='160px' %}
    </div>
    <h1 style="font-size:34px;margin:16px 0 8px">{{ t.registerDone }}</h1>
    <p class="hb-muted" style="font-size:17px;margin:0 0 24px">{{ t.registerDoneBody }}</p>
    <a class="hb-btn hb-btn--primary" href="{% url 'login' %}">{{ t.signIn }}</a>
  </div>
</div>
{% endblock content %}
